{% set name = "compressed-tensors" %}
{% set version = "0.17.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 15c20d06bdbcf35b51fc99fd125e7b9be1e1855567c33b7a46dfac26ad6fb126

build:
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python
    - setuptools
    # pyproject.toml calls for setuptools-scm 8.2.0, but there isn't a version of that available on the main conda channel.
    - setuptools-scm >=8.2,<9.0
    - pip
    - wheel
  run:
    - python
    - pytorch >=2.10.0
    - transformers >=4.45.0
    - pydantic >=2.0
    - loguru
    # Eager runtime import in compressed_tensors/offload/load.py — not listed
    # in upstream `requires_dist` but required at import time of the top-level
    # `compressed_tensors` package.
    - psutil

test:
  imports:
    - compressed_tensors
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/vllm-project/compressed-tensors
  summary: Library for utilization of compressed safetensors of neural network models
  description: |
    The compressed-tensors library extends the safetensors format, providing a
    versatile and efficient way to store and manage compressed tensor data. This
    library supports various quantization and sparsity schemes, making it a
    unified format for handling different model optimizations like GPTQ, AWQ,
    SmoothQuant, INT8, FP8, SparseGPT, and more.
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  doc_url: https://github.com/vllm-project/compressed-tensors
  dev_url: https://github.com/vllm-project/compressed-tensors

extra:
  skip-lints:
    - cbc_dep_in_run_missing_from_host
  recipe-maintainers:
    - ianaobi
    - bkreider
    - maresb
