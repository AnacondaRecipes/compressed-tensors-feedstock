{% set name = "compressed-tensors" %}
{% set version = "0.10.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 6de13ac535d7ffdd8890fad3d229444c33076170acaa8fab6bab8ecfa96c1d8f

build:
  skip: true # [ py<310 ]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python
    - setuptools
    # pyproject.toml calls for setuptools-scm 8.2.0, but there isn't a version of that available on the main conda channel.
    - setuptools-scm ==8.2.1
    - pip
    - wheel
  run:
    - python
    - pytorch >=1.7.0
    - transformers
    - pydantic >=2.0
    #- safetensors
    #- transformers
    #- transformer-utils

test:
  imports:
    - compressed_tensors
  commands:
    - pip check
  requires:
    - python
    - pip

about:
  home: https://github.com/neuralmagic/compressed-tensors
  summary: Library for utilization of compressed safetensors of neural network models
  license: Apache-2.0
  license_file: LICENSE

extra:
  anaconda-services:
    ref: https://anaconda.zendesk.com/agent/tickets/49522
    reason: Dependency for vllm
  recipe-maintainers:
    - ianaobi
    - bkreider
  recipe-maintainers:
    - maresb
